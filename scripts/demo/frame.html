<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Inkwell demo frame</title>
<style>
html,body{margin:0;height:100%;background:#1e1e1e;font:13px -apple-system,"Segoe UI",system-ui,sans-serif;color:#ccc;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
.title{height:30px;background:#181818;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #2b2b2b;color:#9d9d9d;font-size:12px;position:relative}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.title .t{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.tabs{height:35px;background:#181818;display:flex;align-items:flex-end}
.tab{height:35px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:8px;background:#1f1f1f;color:#fff;border-top:1px solid #0078d4;border-right:1px solid #2b2b2b}
.tab .ic{color:#519aba;font-weight:700;font-size:11px}.tab .x{color:#888;margin-left:8px}
iframe{flex:1;border:0;width:100%;background:#fff}
</style></head><body><div class="app">
<div class="title"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="t">notes.md — Inkwell Markdown</div></div>
<div class="tabs"><div class="tab"><span class="ic">M↓</span>notes.md<span class="x">×</span></div></div>
<iframe id="wv" src=""></iframe></div>
<script>document.getElementById('wv').src='webview.html'+location.search;</script></body></html>
